    ErrorProperties:
      example:
        type: type
        message: message
        fields:
          key: ''
      properties:
        type:
          type: string
        message:
          type: string
        fields:
          additionalProperties: true
          type: object
      title: ErrorProperties
      type: object
    location_shared:
      properties:
        ip_address:
          description: The applicant's ip address.
          type: string
        country_of_residence:
          allOf:
          - $ref: '#/components/schemas/country_codes'
          description: The applicant's country of residence in 3-letter ISO code.
          example: GBR
      type: object
    document_uploader:
      allOf:
      - $ref: '#/components/schemas/document_shared'
      - $ref: '#/components/schemas/document_request'
      required:
      - applicant_id
      - file
      - type
    document_response:
      properties:
        id:
          description: The unique identifier for the document
          format: uuid
          type: string
        created_at:
          description: The date and time at which the document was uploaded
